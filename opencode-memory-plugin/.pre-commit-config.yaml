# Pre-commit 配置 - OpenCode Memory Plugin

default_stages: [pre-commit]
fail_fast: true

exclude: '^node_modules/|^dist/|^build/|^\.git/|^\.opencode/'

repos:
  # ===========================================
  # 🔐 安全扫描 (P0 - 最高优先级)
  # ===========================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: 🔐 Gitleaks - Secret Detection
        description: Detect hardcoded secrets using Gitleaks
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # ===========================================
  # 🔍 代码检查 (P1)
  # ===========================================
  - repo: local
    hooks:
      - id: oxlint
        name: 🔍 Oxlint - Code Linting
        entry: npx oxlint --fix
        language: system
        files: '\.(js|mjs|cjs)$'
        exclude: 'node_modules/'
        stages: [pre-commit]

  # ===========================================
  # 📝 代码格式化 (P2)
  # ===========================================
  - repo: local
    hooks:
      - id: prettier
        name: 💅 Prettier - Code Formatting
        entry: npx prettier --write --ignore-unknown
        language: system
        files: '\.(js|mjs|cjs|ts|json|md|yaml|yml)$'
        stages: [pre-commit]

  # ===========================================
  # 📝 Markdown 检查 (P3)
  # ===========================================
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.0
    hooks:
      - id: markdownlint-cli2
        name: 📝 Markdownlint - Markdown Linting
        types: [markdown]
        stages: [pre-commit]

  # ===========================================
  # 🧪 测试运行 (P4 - 质量门禁)
  # ===========================================
  - repo: local
    hooks:
      - id: jest
        name: 🧪 Jest Tests - Run All Tests
        description: Run all tests before commit to ensure code quality
        entry: npm test
        language: system
        files: '\.(js|mjs|cjs)$'
        exclude: 'node_modules/'
        pass_filenames: false
        stages: [pre-commit]
        always_run: true
